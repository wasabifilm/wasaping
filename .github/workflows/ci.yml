name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

# A newer push supersedes the run still going on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false # no dependencies, no go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      # Show gear simulated on the runner: Art-Net, sACN, DMX, RDM, Identify.
      - if: runner.os == 'Linux'
        run: go test ./scanner -run Integration -v
        env:
          WASAPING_INTEGRATION: "1"
      - if: runner.os == 'Linux'
        name: vet for the other systems
        run: |
          GOOS=darwin go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...

  # macOS on its own: its runners can stay queued for a long time, and a
  # release must not wait for this job (it runs the same checks itself).
  test-macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: sh scripts/build_macapp.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # macOS: wasaping.app uses Cocoa/WebKit via cgo; the other targets cross-compile.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: make release VERSION=${GITHUB_REF_NAME}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
