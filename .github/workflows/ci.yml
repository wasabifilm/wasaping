name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false # no dependencies, no go.sum
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'macOS'
        run: sh scripts/build_macapp.sh
      - run: go build .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # macOS: wasaping.app uses Cocoa/WebKit via cgo; the other targets cross-compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false # no dependencies, no go.sum
      - run: make release VERSION=${GITHUB_REF_NAME}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
